# https://zensical.org/docs/compatibility/mkdocs/migration/

# Project information
site_author: MLOps Courses
site_name: MLOps Coding Course
site_url: https://mlops-coding-course.fmind.dev/
site_description: Learn how to create, develop, and maintain a state-of-the-art MLOps code base.

# Repository
repo_name: MLOps-Courses/mlops-coding-course
repo_url: https://github.com/MLOps-Courses/mlops-coding-course

# Copyright
copyright: Copyright &copy; MLOps Courses

# Configs
strict: true
validation:
  links:
    not_found: warn
    unrecognized_links: warn
use_directory_urls: false

# Theme
theme:
  name: material
  variant: classic
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    scheme: default
    primary: indigo

  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.tabs

# Extra
extra:
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:mlops-coding-course@fmind.dev
    - icon: fontawesome/brands/github
      link: https://github.com/MLOps-Courses/mlops-coding-course
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/fmind_dev
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/fmind-dev/
  analytics:
    provider: google
    property: G-MWT9Z8Y8PW
extra_css:
  - stylesheets/extra.css

# Extensions
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

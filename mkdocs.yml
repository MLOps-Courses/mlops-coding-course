# https://zensical.org/docs/compatibility/mkdocs/migration/

# Project information
site_author: Médéric Hurier (Fmind)
site_name: MLOps Coding Course
site_url: https://mlops-coding-course.fmind.dev/
site_description: Learn how to create, develop, and maintain a state-of-the-art MLOps code base.

# Repository
repo_name: fmind/mlops-coding-course
repo_url: https://github.com/fmind/mlops-coding-course

# Copyright
copyright: Copyright &copy; Médéric Hurier (Fmind) &ndash; <a href="#__consent">Change cookie settings</a>

# Configs
strict: true
validation:
  links:
    not_found: warn
    unrecognized_links: warn
use_directory_urls: false

# Theme
theme:
  name: material
  variant: classic
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    scheme: default
    primary: indigo

  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.tabs

# Extra
extra:
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:mlops-coding-course@fmind.dev
    - icon: fontawesome/brands/github
      link: https://github.com/fmind/mlops-coding-course
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/fmind_dev
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/fmind-dev/
  analytics:
    provider: google
    property: G-MWT9Z8Y8PW
  # EU consent: Google Analytics loads only after a visitor accepts; rejecting is one click, like accepting.
  consent:
    title: Cookie consent
    description: >-
      With your consent, Google Analytics measures which lessons help learners so the course can improve. It
      loads only after you accept, and you can change your choice from the footer at any time. See the
      <a href="https://www.fmind.dev/privacy">privacy notice</a>.
    actions:
      - accept
      - reject
      - manage
extra_css:
  - stylesheets/extra.css

# Extensions
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
